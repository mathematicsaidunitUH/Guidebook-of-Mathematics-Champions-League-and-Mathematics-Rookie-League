<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guidebook MCL & MRL</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#230506;--panel:#38090c;--ink:#fbf1f1;--mut:#dbb5b7;--red:#d11a20;--gold:#ff9ea4;--line:#601a1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--panel:#fff7f6;--ink:#240608;--mut:#6d4448;--red:#a80000;--gold:#a80000;--line:#efcfcf}}
:root[data-theme="light"]{--bg:#fff;--panel:#fff7f6;--ink:#240608;--mut:#6d4448;--red:#a80000;--gold:#a80000;--line:#efcfcf}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;overflow-x:hidden;line-height:1.55}
h1,h2{font-family:"Bricolage Grotesque",Figtree,sans-serif;margin:0;line-height:1.05}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.sym{position:fixed;font-family:"Bricolage Grotesque",serif;color:var(--line);font-weight:800;pointer-events:none;animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-22px) rotate(10deg)}}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:5;transition:transform .9s cubic-bezier(.7,0,.2,1),opacity .9s}
#intro.go{transform:scale(2.6) rotate(-14deg);opacity:0;pointer-events:none}
.logo{width:clamp(110px,22vw,170px);border-radius:50%;margin-bottom:18px;box-shadow:0 0 0 5px #fff,0 10px 30px rgba(0,0,0,.45);animation:wob 3s ease-in-out infinite}
#intro h1{font-size:clamp(2.4rem,9vw,5.5rem);font-weight:800;letter-spacing:-.02em}
#intro h1 span{display:inline-block;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-8px)}}
#intro p{color:var(--mut);max-width:34ch;margin:18px 0 34px}
#start{background:var(--red);color:#fff;border:0;border-radius:999px;padding:18px 54px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.5rem;box-shadow:0 8px 0 rgba(0,0,0,.35);animation:pulse 1.6s ease-in-out infinite;transition:transform .15s,box-shadow .15s}
#start:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
@keyframes pulse{50%{transform:scale(1.07) rotate(-1.5deg)}}
#guide{position:fixed;inset:0;display:none;grid-template-columns:minmax(150px,260px) 1fr;gap:24px;align-items:center;max-width:1080px;margin:0 auto;padding:24px;z-index:3}
#guide.on{display:grid}
#guide.on .mascot-wrap{animation:enter .9s .35s cubic-bezier(.2,1.5,.4,1) both}
@keyframes enter{from{transform:translateX(-120%) rotate(-40deg)}to{transform:none}}
.mascot-wrap{text-align:center}
.mascot{width:100%;max-width:220px;animation:sway 2.2s ease-in-out infinite;transform-origin:50% 90%;cursor:pointer}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-6px)}}
.mascot.jump{animation:jump .7s}
@keyframes jump{30%{transform:translateY(-40px) scale(.9,1.15)}60%{transform:scale(1.15,.85)}100%{transform:none}}
.bubble{position:relative;background:#fff;color:#240608;border-radius:18px;padding:10px 14px;font-weight:600;font-size:.95rem;margin-bottom:14px;animation:pop .4s both}
.bubble:after{content:"";position:absolute;bottom:-9px;left:50%;border:10px solid transparent;border-top-color:#fff;border-bottom:0;margin-left:-10px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.book{perspective:1400px}
.page{background:var(--panel);border:2px solid var(--line);border-radius:6px 22px 22px 6px;border-left:10px solid var(--red);padding:clamp(20px,4vw,40px);max-height:calc(100vh - 150px);overflow-y:auto;transform-origin:left center}
.page.flip{animation:flip .6s both}
@keyframes flip{from{transform:rotateY(-70deg);opacity:0}to{transform:none;opacity:1}}
.page h2{font-size:clamp(1.7rem,4.4vw,2.8rem);margin-bottom:12px}
.page ul{padding-left:1.1em;margin:10px 0}
.page li{margin:6px 0}
.page b{color:var(--gold)}
.tbl{display:grid;grid-template-columns:1fr auto;gap:2px 16px;margin:12px 0}
.tbl div{padding:6px 0;border-bottom:1px solid var(--line)}
.tbl .v{font-weight:800;color:var(--gold);text-align:right}
.sim{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.sim button{background:transparent;border:2px solid var(--red);border-radius:12px;padding:8px 12px;font-weight:600;transition:transform .15s,background .15s}
.sim button:hover{background:var(--red);color:#fff;transform:rotate(-2deg) scale(1.04)}
.score{font-family:"Bricolage Grotesque",sans-serif;font-size:2.4rem;font-weight:800;color:var(--gold)}
.score.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px) rotate(-2deg)}75%{transform:translateX(8px) rotate(2deg)}}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.nav button{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:10px 22px;font-weight:600}
.nav button.next{background:var(--red);border-color:var(--red);color:#fff}
.nav button:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--line);transition:.3s}
.dots i.on{background:var(--gold);transform:scale(1.5)}
@media(max-width:720px){#guide{grid-template-columns:1fr;align-content:start;padding:12px;gap:6px;overflow-y:auto}.mascot{max-width:96px}.mascot-wrap{display:flex;align-items:flex-end;gap:12px;text-align:left}.bubble{margin:0 0 18px;flex:1}.bubble:after{display:none}.page{max-height:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>

<span class="sym" style="top:16%;right:9%;font-size:4rem;animation-delay:-2s">∑</span>
<span class="sym" style="bottom:12%;left:12%;font-size:4.5rem;animation-delay:-4s">∫</span>
<span class="sym" style="bottom:18%;right:6%;font-size:5rem;animation-delay:-1s">√</span>

{s:"Halo! Aku Pi, pemandumu.",h:"Gambaran liga",b:"<p>Kompetisi cerdas cermat matematika dari Pusat Konsultasi Matematika, Departemen Matematika UNHAS. Ada dua liga dengan aturan main identik.</p><ul><li>Format <b>round-robin</b>: tiap peserta melawan semua lawan satu kali, 1 lawan 1.</li><li>Berjalan <b>9 pekan</b>.</li><li>Klasemen akhir jadi tolok ukur dosen pendamping untuk seleksi pembiayaan dan pembinaan delegasi nasional.</li></ul>"},
{s:"Ada dua kasta, pilih yang cocok!",h:"MCL dan MRL",b:"<p><b>MCL (Kasta Utama)</b></p><ul><li>Veteran atau berpengalaman olimpiade matematika universitas</li><li>Khusus angkatan 2024 dan 2025</li><li>Tepat 10 peserta tetap</li></ul><p><b>MRL (Kasta Penantang)</b></p><ul><li>Mahasiswa aktif Departemen Matematika dan Statistika</li><li>Masuk lewat babak playoff, 10 nilai tertinggi lolos</li><li>Wajib memilih 1 mentor dari angkatan 2023</li></ul>"},
{s:"Ujian dulu sebelum masuk liga.",h:"Playoff MRL",b:"<p>Semua pendaftar MRL mengikuti ujian tertulis dengan total <b>60 poin</b>.</p><div class='tbl'><div>Isian singkat, 5 soal (benar +2, salah 0)</div><div class='v'>10</div><div>Uraian, 5 soal (maks 10 per soal, dinilai dari langkah)</div><div class='v'>50</div></div><p>Sepuluh peserta dengan poin tertinggi lolos jadi peserta resmi.</p>"},
{s:"Cepat dan teliti, ya!",h:"Cara duel berlangsung",b:"<ul><li>Cerdas cermat langsung, jumlah soal dirahasiakan sampai pertandingan mulai.</li><li>Waktu <b>tepat 5 menit</b> per soal.</li><li>Tiap peserta boleh menjawab maksimal <b>2 kali</b> per soal.</li><li><b>Rebutan</b>: kalau lawan salah di kesempatan pertama atau menyerah, kamu boleh merebut hak jawab selama waktu belum habis.</li></ul>"},
{s:"Coba tekan tombolnya!",h:"Skor tiap soal",b:"<p>Coba simulasikan satu duel. Skor kamu:</p><div class='score' id='sc'>0</div><div class='sim'><button data-p='100'>Benar</button><button data-p='0'>Salah pertama</button><button data-p='-50'>Salah kedua</button><button data-p='0'>Tidak menjawab</button><button data-r='1'>Ulang</button></div><div class='tbl'><div>Menjawab benar</div><div class='v'>+100</div><div>Tidak menjawab</div><div class='v'>0</div><div>Salah kesempatan pertama</div><div class='v'>0</div><div>Salah kesempatan kedua (hak jawab hilang)</div><div class='v'>-50</div></div>"},
{s:"Menang itu tiga poin!",h:"Klasemen dan tie-breaker",b:"<p>Peringkat ditentukan Poin Liga dari hasil akhir tiap pekan.</p><div class='tbl'><div>Menang</div><div class='v'>+3</div><div>Seri</div><div class='v'>+1</div><div>Kalah</div><div class='v'>0</div></div><p>Kalau Poin Liga sama, peringkat ditentukan <b>total soal benar</b> selama 9 pekan. Kolom skor di situs klasemen hanya informasi tambahan.</p>"},
{s:"Jangan sampai terlambat!",h:"Walkover (WO)",b:"<ul><li><b>Kamu tidak hadir</b> sampai pertandingan selesai: kalah WO, tanpa poin liga, dan skor <b>-50</b> di awal pertandingan pekan berikutnya.</li><li><b>Lawan tidak hadir</b>: kamu tetap mengerjakan soal sampai selesai untuk mengumpulkan jumlah soal benar buat tie-breaker.</li><li><b>Keduanya tidak hadir</b>: seri, dan keduanya kena penalti -50 di pekan berikutnya.</li></ul>"},
{s:"Sampai jumpa di arena!",h:"Siap bertanding",b:"<p>Ringkasnya: 10 peserta per liga, 9 pekan, duel 5 menit per soal, menang +3, dan jangan lupa hadir tepat waktu.</p><p>Pantau klasemen, jadwal, dan hasil di situs liga. Semoga sukses!</p>"}

C.forEach(function(){dots.appendChild(document.createElement('i'))});
function show(){
  var c=C[i];
  page.innerHTML='<h2>'+c.h+'</h2>'+c.b;
  page.classList.remove('flip');void page.offsetWidth;page.classList.add('flip');
  var s=$('say');s.textContent=c.s;s.style.animation='none';void s.offsetWidth;s.style.animation='';
  [].forEach.call(dots.children,function(d,k){d.className=k===i?'on':''});
  $('prev').disabled=i===0;
  $('next').textContent=i===C.length-1?'Ulangi':'Lanjut';
  sc=0;
  var sim=page.querySelector('.sim');
  if(sim)sim.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    var el=$('sc');
    if(b.dataset.r)sc=0;else sc+=+b.dataset.p;
    el.textContent=sc;el.classList.remove('shake');void el.offsetWidth;
    if(b.dataset.p==='-50')el.classList.add('shake');
    if(b.dataset.p==='100')jump();
  });
}
function jump(){var m=$('mascot');m.classList.remove('jump');void m.offsetWidth;m.classList.add('jump')}
$('mascot').addEventListener('click',jump);
$('start').addEventListener('click',function(){
  $('intro').classList.add('go');
  setTimeout(function(){$('guide').classList.add('on');show()},500);
});
$('next').addEventListener('click',function(){i=i===C.length-1?0:i+1;show()});
$('prev').addEventListener('click',function(){if(i>0){i--;show()}});
document.addEventListener('keydown',function(e){
  if(!$('guide').classList.contains('on'))return;
  if(e.key==='ArrowRight')$('next').click();
  if(e.key==='ArrowLeft')$('prev').click();
});
document.addEventListener('mousemove',function(e){
  var x=(e.clientX/innerWidth-.5)*8,y=(e.clientY/innerHeight-.5)*6;
  $('pl').setAttribute('cx',76+x);$('pl').setAttribute('cy',90+y);
  $('pr').setAttribute('cx',132+x);$('pr').setAttribute('cy',90+y);
});
</script>
</body>
</html>
